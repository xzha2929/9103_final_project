<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Audio-Reactive River</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #222831;
      color: #f6ede5;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      border-radius: 8px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 20px;
    }

    button {
      padding: 12px 28px;
      border: 0;
      border-radius: 6px;
      background: #f2b49a;
      color: #282329;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    label {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #status {
      min-height: 24px;
      line-height: 1.5;
    }

    .hint {
      color: #c9c1bd;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <div id="canvas-container"></div>

    <div class="controls">
      <button id="play-button" disabled>Loading...</button>

      <label>
        Sensitivity
        <input
          id="sensitivity"
          type="range"
          min="1"
          max="12"
          step="0.5"
          value="5"
        >
      </label>
    </div>

    <p id="status" role="status">Loading artwork...</p>

    <p class="hint">
      Bass creates broad ripples. Treble creates finer ripples.
      Loudness controls wave strength.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/addons/p5.sound.min.js"></script>

  <script src="audioMechanic.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
