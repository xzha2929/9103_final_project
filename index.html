<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Perlin Sunset Prototype</title>

    <link rel="stylesheet" href="style.css" />

  <!-- p5.js libraries -->
<script src="libraries/p5.min.js"></script>
<script src="libraries/p5.sound.min.js"></script>

<!-- Independent mechanic classes -->
<script src="perlin-environment.js"></script>
<script src="audio-river.js"></script>
<script src="bird-game.js"></script>

<!-- Main shared p5 program: must load last -->
<script src="sketch.js"></script>

  </head>

  <body>
    <main>
      <!-- p5 canvas will be placed here -->
      <div id="canvas-container"></div>
      <section class="audio-controls">
  <button id="play-button" type="button">
    Loading Audio...
  </button>

  <label>
    Sensitivity
    <input
      id="sensitivity"
      type="range"
      min="1"
      max="12"
      step="0.5"
      value="5"
    />
  </label>

  <span id="status">Loading audio...</span>
</section>

      <section class="instructions">
  <span><strong>Hold A / D</strong> — control cloud wind</span>
  <span><strong>Automatic</strong> — clouds move and the sun rises</span>
  <span><strong>Press P</strong> — pause or resume</span>
  <span><strong>Press R</strong> — create a new variation</span>
</section>
    </main>
  </body>
</html>
