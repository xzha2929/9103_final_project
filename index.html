!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Perlin Sunset Prototype</title>

    <link rel="stylesheet" href="style.css" />

    <!-- p5.js library -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>

    <!-- Our animation class -->
    <script src="perlin-environment.js"></script>

    <!-- Main p5 program -->
    <script src="sketch.js"></script>
  </head>

  <body>
    <main>
      <!-- p5 canvas will be placed here -->
      <div id="canvas-container"></div>

      <section class="instructions">
        <span>
          <strong>Move left / right</strong>
          — gentle cloud breeze
        </span>

        <span>
          <strong>Automatic</strong>
          — sun slowly rises
        </span>

        <span>
          <strong>Click</strong>
          — pause / play
        </span>

        <span>
          <strong>Press R</strong>
          — restart variation
        </span>
      </section>
    </main>
  </body>
</html>
